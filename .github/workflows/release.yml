# A v* tag: test, build the sdist and wheel once, publish them to PyPI by trusted publishing (no token:
# PyPI trusts this workflow in the `pypi` environment), then make a GitHub release with the changelog section.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - name: Tag matches the version
        shell: bash
        run: |
          version="$(grep -m1 '^version' pyproject.toml | sed 's/.*"\(.*\)"/\1/')"
          package="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/nuh/__init__.py)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ] || [ "${package}" != "${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME}, pyproject.toml ${version} and nuh.__version__ ${package} must agree"
            exit 1
          fi
      - name: Lint and test
        run: |
          pip install -e '.[dev]'
          ruff check --isolated --select E9,F63,F7,F82 src tests scripts
          pytest tests/ --ignore=tests/test_llm_live.py -q
      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/nuh/
    permissions:
      id-token: write  # trusted publishing: the OIDC token PyPI exchanges for an upload credential
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2

  github-release:
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # gh release create
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Release notes from CHANGELOG.md
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {found=1; next} /^## \[/ {if (found) exit} found {print}' \
            CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "CHANGELOG.md has no section for ${version}"
            exit 1
          fi
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
